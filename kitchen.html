<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍳 شاشة المطبخ — alfaprosys</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="assets/icon/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icon/logo.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/kitchen.css" />
</head>
<body>
  <!-- بانرات الإلغاء -->
  <div id="kdsBanners" style="position:fixed;top:60px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;padding:0 16px;"></div>

  <!-- الشريط العلوي -->
  <header class="kds-topbar">
    <div class="kds-brand">
      <span>🍳</span>
      <span>المطبخ</span>
    </div>
    <div class="kds-stats">
      <div class="kds-stat new-stat">
        <span class="num" id="statNew">0</span>
        <span>جديد</span>
      </div>
      <div class="kds-stat cooking-stat">
        <span class="num" id="statCooking">0</span>
        <span>قيد التحضير</span>
      </div>
      <div class="kds-stat ready-stat">
        <span class="num" id="statReady">0</span>
        <span>جاهز</span>
      </div>
    </div>
    <span class="kds-clock" id="kdsClock">--:--:--</span>
    <span id="kdsStale" style="display:none;"></span>
    <div class="kds-topbar-actions">
      <button class="kds-topbar-btn" onclick="toggleFullscreen()" title="ملء الشاشة">⛶</button>
      <a class="kds-topbar-btn" href="pos.html" style="text-decoration:none;">→ POS</a>
    </div>
  </header>

  <!-- شبكة الطلبات -->
  <div class="kds-body" id="kdsGrid">
    <div class="kds-empty">
      <div class="kds-empty-icon">⏳</div>
      <div class="kds-empty-text">جاري التحميل...</div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/sync/storage.js"></script>
  <script src="assets/js/sync/outbox.js"></script>
  <script src="assets/js/sync/queue.js"></script>
  <script src="assets/js/sync/remote.js"></script>
  <script src="assets/js/sync/manager.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/stock.js"></script>
  <script src="assets/js/kitchen.js"></script>
</body>
</html>
